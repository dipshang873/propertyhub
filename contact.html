<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Portal | PropertyHub</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .contact-wrapper {
            display: grid;
            grid-template-columns: 0.8fr 1.2fr;
            gap: 40px;
            margin: 60px 0;
        }
        .info-panel {
            background: linear-gradient(135deg, rgba(197, 160, 89, 0.1), transparent);
            padding: 40px;
            border-radius: 24px;
            border: 1px solid var(--glass-border);
        }
        .contact-form-card {
            background: var(--glass-bg);
            padding: 40px;
            border-radius: 24px;
            border: 1px solid var(--glass-border);
        }
        .input-group {
            margin-bottom: 25px;
        }
        .input-group label {
            display: block;
            margin-bottom: 10px;
            color: var(--primary-gold);
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .input-group input, .input-group textarea {
            width: 100%;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--glass-border);
            padding: 15px;
            border-radius: 12px;
            color: #fff;
            transition: var(--transition);
        }
        .input-group input:focus {
            border-color: var(--primary-gold);
            outline: none;
            background: rgba(255,255,255,0.1);
        }
        .contact-method {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 30px;
        }
        .method-icon {
            width: 45px;
            height: 45px;
            background: var(--primary-gold);
            color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
        }
    </style>
</head>
<body>
    <div class="page-wrapper">
        <nav>
            <a href="index.html" class="logo"><i class="fas fa-house-chimney-window" style="color: var(--primary-gold);"></i> PropertyHub</a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="feature.html">Features</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="testimonial.html">Testimonials</a></li>
                <li><a href="contact.html" class="active">Contact</a></li>
            </ul>
            <button class="btn-gold">Urgent Inquiry</button>
        </nav>

        <main class="container animate">
            <div class="contact-wrapper">
                <div class="info-panel">
                    <h2 style="margin-bottom: 30px;">Let's Connect.</h2>
                    <div class="contact-method">
                        <div class="method-icon"><i class="fas fa-location-dot"></i></div>
                        <div><p>Headquarters</p><strong>Kathmandu, Nepal[cite: 3]</strong></div>
                    </div>
                    <div class="contact-method">
                        <div class="method-icon"><i class="fas fa-envelope"></i></div>
                        <div><p>Technical Support</p><strong>dev@propertyhub.com.np</strong></div>
                    </div>
                    <div class="contact-method">
                        <div class="method-icon"><i class="fas fa-phone"></i></div>
                        <div><p>24/7 Hotline</p><strong>+977 1-4000000</strong></div>
                    </div>
                </div>

                <div class="contact-form-card">
                    <form action="#">
                        <div class="input-group">
                            <label>Full Name</label>
                            <input type="text" placeholder="John Doe" required>
                        </div>
                        <div class="input-group">
                            <label>Email Address</label>
                            <input type="email" placeholder="john@example.com" required>
                        </div>
                        <div class="input-group">
                            <label>How can we help?</label>
                            <textarea rows="4" placeholder="Describe your property needs..."></textarea>
                        </div>
                        <button class="btn-gold" style="width: 100%; padding: 20px;">Send Message</button>
                    </form>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
