<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Contact - PropertyHub</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .contact-form { max-width: 500px; margin: 120px auto; background: var(--glass-bg); padding: 40px; border-radius: 20px; border: 1px solid var(--glass-border); }
        input, textarea { width: 100%; padding: 12px; margin-bottom: 20px; background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); color: white; border-radius: 5px; }
    </style>
</head>

<body>
    <nav>...</nav>
    <div class="contact-form">
        <h2 style="color: var(--primary-gold); margin-bottom: 20px;">Direct Support</h2>
        <input type="text" placeholder="Your Name">
        <input type="email" placeholder="Your Email">
        <textarea rows="5" placeholder="How can we help?"></textarea>
        <button class="btn-gold" style="width: 100%;">Send Message</button>
    </div>
    <section class="container animate">
    <div style="max-width: 500px; margin: 0 auto;">
        <a href="index.html" style="text-decoration: none; color: var(--primary-gold); display: inline-flex; align-items: center; gap: 8px; margin-bottom: 20px; font-weight: bold;">
            <i class="fas fa-arrow-left"></i> Back to Home
        </a>

        <div class="glass-panel" style="padding: 40px;">
            <h2 style="color: var(--primary-gold); margin-bottom: 20px;">Direct Support</h2>
            </div>
    </div>
</section>
</body>
</html>
